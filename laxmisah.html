<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Laxmi Sah | Portfolio</title>
    <style>
        :root{
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --dark:#0f172a;
            --darker:#020617;
            --text-main: #f8fafc;
            --text-dim:#94a3b8;
            --tansition: 0.3s ease;
        }
      *{
        margin:0;
        padding: 0;
        box-sizing: border-box;
      }
      html{
        scroll-behavior: smooth;
      }
      body{
        font-family: sans-serif;
        background-color: var(--darker);
        color: var(--text-main);
        line-height: 1.6;
      }
      nav{
        position: fixed;
        top:0;
        width: 100%;
        height: 80px;
        background-color: rgba(15,23,42,0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        z-index:1000;
      }
      .nav-container{
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo{
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: bold;
        font-size: 1.2rem;

      }
      .logo-box{
        width: 40px;
        height: 40px;
        background: linear-gradient(to bottom right,var(--primary),var(--secondary));
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
       .nav-links
       {
        list-style: none;
        display: flex;
        gap: 30px;
        align-items: center;
       }
       .nav-links a{
        text-decoration: none;
        color: var(--text-dim);
        font-size: 0.9rem;
        transition: var(--tansition);

       }
       .nav-links a:haver{
        color: var(--primary);
       }
       .btn-talk{
        padding: 8px 20px;
        border-radius: 50px;
        border: 1px solid var(--primary);
        color: var(--primary);
        background: rgba(14, 165, 233, 0.1);
       }
       .hero{
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding-top: 80px;
       }
       .hero-container{
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: lfr lfr;
        gap: 50px;
        align-items: center;
       }
       .hero-container{
        text-align: left;
       }
       .badge{
        display: inline-block;
        padding: 4px 2px;
        border: 1px solid #334155;
        color: var(--primary);
        border-radius: 20px;
        font-size: 0.8rem;
        margin-bottom: 20px;
       }
       h1{
        font-size: 4rem;
        margin-bottom: 20px;
       }
       .gardient-text{
        background: linear-gradient(to right,var(--primary),var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
       }

    </style>
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">
               <div class="logo-box">LS</div>
                <span>Laxmi <span style="color: var(--primary);">Sah</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact" class="btn-talk">Let's Talk</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="hero-container">
                <div class="hero-content">
                    <span class="badge">Available for work</span>
                    <h1>Hi, I'm <span class="gradient-text">Laxmi</span></h1>
                    <h2>I am Developer</h2>
                    <p class="hero-description">
                        I build exceptional digital experiences that are fast, accesible
                        visually appealing, and responsive.
                    </p>
                    <div class="hero-buttons">
                        <a href="#projects" class="btn btn-primary">View Work</a>
                        <a href="#contact"class="btn btn-outline">Contact Me</a>
                    </div>
                </div>
              <div class="hero-visual">
                <div class="palceholder-img">
                [profile Image Placeholder]
                </div>
              </div>
            </div>
        </section>
    </main>
</body>
</html>
